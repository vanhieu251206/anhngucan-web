<!doctype html>
<html lang="vi">

         riêng ở đây, rồi chuyển ngay vào app kèm nguyên tham số (?page=lessons&series=...&go=...). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anh Ngữ C.A.N" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Bài tập online — Anh Ngữ C.A.N" />

    <meta property="og:image:height" content="630" />

    <script>
      window.location.replace("../" + window.location.search);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fffbf2; font-family: "Nunito", system-ui, sans-serif; color: #3b3a36; text-align: center; padding: 16px; box-sizing: border-box; }
      a { display: inline-block; background: #ff7a45; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 999px; }
    </style>
