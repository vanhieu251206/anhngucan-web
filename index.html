<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search chỉ hiện favicon vuông có cạnh là bội số của 48px. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Anh Ngữ C.A.N — Học tiếng Anh vui vẻ cho bé</title>
    <meta name="description" content="Anh Ngữ C.A.N — luyện thi Cambridge Starters, Movers, Flyers, KET/PET và IELTS cho học sinh: Listening, Speaking có chấm giọng nói, Reading theo đúng dạng đề thi thật." />
    <meta name="theme-color" content="#ff7a45" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://anhngucan.com/" />
    <!-- Ảnh + tiêu đề khi chia sẻ link lên Zalo/Facebook/Messenger (cần URL tuyệt đối). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anh Ngữ C.A.N" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://anhngucan.com/" />
    <meta property="og:title" content="Anh Ngữ C.A.N — Học tiếng Anh vui vẻ cho bé" />
    <meta property="og:description" content="Luyện thi Cambridge Starters, Movers, Flyers, KET/PET và IELTS: Listening, Speaking, Reading theo đúng dạng đề thi thật." />
    <meta property="og:image" content="https://anhngucan.com/assets/img/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Anh Ngữ C.A.N",
        "url": "https://anhngucan.com/",
        "logo": "https://anhngucan.com/assets/img/logo.png",
        "image": "https://anhngucan.com/assets/img/og-image.jpg",
        "telephone": "+84903032288",
        "description": "Trung tâm Anh ngữ luyện thi Cambridge Starters, Movers, Flyers, KET/PET và IELTS cho học sinh."
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Skeleton hiện tạm trong lúc tải bundle JS — tránh màn hình trắng xoá, tự bị
           thay thế ngay khi React mount xong (App.jsx render đè lên #root). -->
      <div class="boot-skeleton" aria-hidden="true">
        <div class="boot-skeleton-bar boot-skeleton-bar-lg"></div>
        <div class="boot-skeleton-row">
          <div class="boot-skeleton-card"></div>
          <div class="boot-skeleton-card"></div>
          <div class="boot-skeleton-card"></div>
        </div>
      </div>
    </div>
    <style>
      html, body { background: #fffbf2; margin: 0; }
      .boot-skeleton { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
      .boot-skeleton-bar { border-radius: 999px; background: #f0e9d8; }
      .boot-skeleton-bar-lg { width: min(60%, 360px); height: 22px; margin-bottom: 28px; }
      .boot-skeleton-row { display: flex; gap: 20px; flex-wrap: wrap; }
      .boot-skeleton-card { flex: 1 1 260px; height: 180px; border-radius: 20px; background: #f0e9d8; }
      .boot-skeleton-bar, .boot-skeleton-card {
        background-image: linear-gradient(90deg, #f0e9d8 0%, #f7f2e6 50%, #f0e9d8 100%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes boot-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-skeleton-bar, .boot-skeleton-card { animation: none; }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
